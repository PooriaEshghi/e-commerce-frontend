<div class="cart-area">
    <a routerLink="/cart-details" [attr.aria-label]="'Cart, ' + totalQuantity + ' items, ' + (totalPrice | currency:'EUR')">
        <i class="fa fa-shopping-cart" aria-hidden="true"></i>
        <span class="total">{{ totalPrice | currency: 'EUR' }}
            <span>{{ totalQuantity }}</span>
        </span>
    </a>
</div>
