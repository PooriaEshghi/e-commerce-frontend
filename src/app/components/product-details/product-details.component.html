<div class="main-content">
  <div class="detail-section">
    <img [src]="product.imageUrl | shopImage" [alt]="product.name" class="detail-img" />

    <div class="detail-copy">
      <h1>{{ product.name }}</h1>
      <div class="price">{{ product.unitPrice | currency : "EUR" }}</div>
      <div class="detail-actions">
        <button type="button" (click)="addToCart()" class="btn btn-primary">Add to cart</button>
        <a *ngIf="authService.isAdmin()" [routerLink]="['/admin/products', product.id]" class="btn btn-info">Edit</a>
      </div>

      <h2>Description</h2>
      <p>{{ product.description }}</p>

      <a routerLink="/products" class="back-link">Back to catalog</a>
    </div>
  </div>
</div>
