<div class="main-content">
  <div class="section-content section-content-p30">
    <div class="container-fluid">
      <h1 class="page-title">Catalog</h1>
      <div class="row catalog-grid">
        <div *ngFor="let tempProduct of products" class="col-6 col-md-4 col-xl-3">
          <div class="product-box">
            <a routerLink="/products/{{ tempProduct.id }}">
              <img [src]="tempProduct.imageUrl | shopImage" [alt]="tempProduct.name" class="img-responsive" />
            </a>

            <a class="product-name" routerLink="/products/{{ tempProduct.id }}">
              <h2>{{ tempProduct.name }}</h2>
            </a>

            <div class="price">
              {{ tempProduct.unitPrice | currency : "EUR" }}
            </div>
            <button type="button" (click)="addToCart(tempProduct)" class="btn btn-primary">
              Add to cart
            </button>
          </div>
        </div>

        <!-- if products empty then display a message-->
        <div
          *ngIf="products?.length == 0"
          class="alert alert-warning col-md-12"
          role="alert"
        >
          No products found.
        </div>
      </div>

      <!-- begin footer -->
      <div class="catalog-footer">
        <ngb-pagination
          [(page)]="thePageNumber"
          [pageSize]="thePageSize"
          [collectionSize]="theTotalElements"
          [maxSize]="5"
          [boundaryLinks]="true"
          aria-label="Catalog pages"
          (pageChange)="listProducts()"
        >
        </ngb-pagination>

        <label class="page-size" for="page-size">Page size
          <select id="page-size" #myPageSelect (change)="updatePageSize(myPageSelect.value)">
            <option>2</option>
            <option>5</option>
            <option>10</option>
            <option selected="true">20</option>
            <option>50</option>
          </select>
        </label>
      </div>
      <!-- end footer -->
    </div>
  </div>
</div>
